<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Zamek</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

:root {
    --cell: clamp(58px, 16vw, 105px);
}

.background {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(
            circle at 50% 45%,
            #252525 0%,
            #0b0b0b 45%,
            #000 100%
        );
}

.lock {
    position: relative;
    z-index: 5;
    width: min(94vw, 620px);
    padding: clamp(18px, 5vw, 32px);
    border-radius: 25px;

    background:
        linear-gradient(
            145deg,
            #5b5b5b,
            #222 17%,
            #090909 50%,
            #383838 83%,
            #111
        );

    border: 2px solid #777;

    box-shadow:
        0 25px 70px rgba(0,0,0,.9),
        inset 0 2px 2px rgba(255,255,255,.25),
        inset 0 -5px 10px rgba(0,0,0,.8);

    animation: appear .7s ease-out;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(.9);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.top-line {
    width: 70%;
    height: 4px;
    margin: 0 auto 18px;
    border-radius: 10px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #888,
            #fff,
            #888,
            transparent
        );

    opacity: .55;
}

.digits {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: clamp(5px, 2vw, 14px);
    padding: 12px 6px;
    border-radius: 16px;

    background:
        linear-gradient(
            180deg,
            #050505,
            #292929 50%,
            #050505
        );

    box-shadow:
        inset 0 8px 16px rgba(0,0,0,.9),
        inset 0 -8px 16px rgba(0,0,0,.9);
}

.reel {
    position: relative;
    flex: 1 1 0;
    min-width: 0;
    height: calc(var(--cell) * 3);
    overflow: hidden;
    border-radius: 12px;

    background:
        linear-gradient(
            90deg,
            #101010,
            #444 20%,
            #1a1a1a 50%,
            #444 80%,
            #101010
        );

    border: 2px solid #111;

    box-shadow:
        inset 0 0 15px rgba(0,0,0,.9),
        0 3px 6px rgba(0,0,0,.8);
}

.reel::before,
.reel::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 36%;
    z-index: 5;
    pointer-events: none;
}

.reel::before {
    top: 0;
    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.95),
            rgba(0,0,0,0)
        );
}

.reel::after {
    bottom: 0;
    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.95),
            rgba(9,9,9,9)
        );
}

.pointer {
    position: absolute;
    z-index: 10;
    left: -2px;
    right: -2px;
    top: 50%;
    height: 3px;
    transform: translateY(-50%);
    background: #eee;

    box-shadow:
        0 0 6px rgba(255,255,255,.9);
}

.strip {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    will-change: transform;
}

.digit {
    width: 100%;
    height: var(--cell);

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: calc(var(--cell) * .78);
    font-weight: 700;
    line-height: var(--cell);

    color: #f1f1f1;

    text-shadow:
        0 3px 3px #000,
        0 0 8px rgba(255,255,255,.12);

    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
}

.bottom-line {
    width: 55%;
    height: 3px;
    margin: 18px auto 0;
    border-radius: 10px;
    background: #777;
    opacity: .4;
}

.confetti {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 7px;
    height: 13px;
    z-index: 30;
    pointer-events: none;

    animation:
        fly var(--duration)
        cubic-bezier(.15,.7,.2,1)
        forwards;
}

@keyframes fly {
    0% {
        opacity: 1;
        transform:
            translate(-50%, -50%)
            rotate(0deg);
    }

    100% {
        opacity: 0;
        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            rotate(var(--rotation));
    }
}
</style>
</head>

<body>

<div class="background"></div>

<div class="lock">

    <div class="top-line"></div>

    <div class="digits">

        <div class="reel">
            <div class="strip" id="reel0"></div>
            <div class="pointer"></div>
        </div>

        <div class="reel">
            <div class="strip" id="reel1"></div>
            <div class="pointer"></div>
        </div>

        <div class="reel">
            <div class="strip" id="reel2"></div>
            <div class="pointer"></div>
        </div>

        <div class="reel">
            <div class="strip" id="reel3"></div>
            <div class="pointer"></div>
        </div>

    </div>

    <div class="bottom-line"></div>

</div>

<script>

/* =========================
   🔐 TWÓJ KOD
   ========================= */

const KOD = [7, 5, 6, 1];

const START = 900;
const OBROT = 1500;
const PRZERWA = 220;
const KONFETTI = 180;


/* =========================
   TARCZE
   ========================= */

const reels = [
    document.getElementById("reel0"),
    document.getElementById("reel1"),
    document.getElementById("reel2"),
    document.getElementById("reel3")
];


/*
   Tworzymy cyfry.
   Jest kilka pełnych obrotów,
   ale zawsze kończymy na właściwej cyfrze.
*/

function buildReel(strip) {

    strip.innerHTML = "";

    for (let round = 0; round < 10; round++) {

        for (let number = 0; number <= 9; number++) {

            const digit = document.createElement("div");

            digit.className = "digit";
            digit.textContent = number;

            strip.appendChild(digit);
        }
    }
}


/*
   Wysokość jednej cyfry.
*/

function getCellHeight() {

    return reels[0]
        .querySelector(".digit")
        .getBoundingClientRect()
        .height;
}


/*
   START = 0000
*/

function showZeros() {

    const h = getCellHeight();

    reels.forEach(strip => {

        strip.style.transition = "none";

        /*
           Pierwsze zero znajduje się
           na pozycji 0.
        */

        strip.style.transform =
            `translateY(0px)`;
    });
}


/*
   OBRÓT JEDNEJ TARCZY
*/

function spin(index, target) {

    return new Promise(resolve => {

        const strip = reels[index];
        const h = getCellHeight();

        /*
           Aktualnie pokazujemy pierwsze zero.
           Przeskakujemy bez animacji do
           dalszego miejsca z zerem.
        */

        const startPosition = 30;

        /*
           Cztery pełne obroty + właściwa cyfra.
        */

        const targetPosition =
            startPosition + 40 + target;

        strip.style.transition = "none";

        strip.style.transform =
            `translateY(${-startPosition * h}px)`;

        void strip.offsetHeight;

        /*
           Właściwy obrót.
        */

        strip.style.transition =
            `transform ${OBROT}ms cubic-bezier(.12,.72,.18,1)`;

        strip.style.transform =
            `translateY(${-targetPosition * h}px)`;


        setTimeout(() => {

            /*
               Po animacji NIE przeskakujemy
               na inną pozycję.
               Dzięki temu nie ma pustego pola.
            */

            strip.style.transition = "none";

            strip.style.transform =
                `translateY(${-targetPosition * h}px)`;

            resolve();

        }, OBROT + 50);
    });
}


/*
   KONFETTI
*/

function launchConfetti() {

    const colors = [
        "#ffffff",
        "#ffd700",
        "#ff3b30",
        "#34c759",
        "#0a84ff",
        "#ff2d55",
        "#bf5af2"
    ];

    for (let i = 0; i < KONFETTI; i++) {

        const piece =
            document.createElement("div");

        piece.className = "confetti";

        const angle =
            Math.random() * Math.PI * 2;

        const distance =
            120 + Math.random() * 360;

        const x =
            Math.cos(angle) * distance;

        const y =
            Math.sin(angle) * distance;

        piece.style.setProperty(
            "--x",
            `${x}px`
        );

        piece.style.setProperty(
            "--y",
            `${y}px`
        );

        piece.style.setProperty(
            "--rotation",
            `${Math.random() * 1400 - 700}deg`
        );

        piece.style.setProperty(
            "--duration",
            `${1.2 + Math.random() * 1.2}s`
        );

        piece.style.background =
            colors[
                Math.floor(
                    Math.random() * colors.length
                )
            ];

        document.body.appendChild(piece);

        setTimeout(() => {
            piece.remove();
        }, 2700);
    }
}


/*
   GŁÓWNA ANIMACJA
*/

async function start() {

    showZeros();

    await new Promise(resolve =>
        setTimeout(resolve, START)
    );


    /* 0000 → 5000 */

    await spin(0, KOD[0]);

    await new Promise(resolve =>
        setTimeout(resolve, PRZERWA)
    );


    /* 5000 → 5300 */

    await spin(1, KOD[1]);

    await new Promise(resolve =>
        setTimeout(resolve, PRZERWA)
    );


    /* 5300 → 5340 */

    await spin(2, KOD[2]);

    await new Promise(resolve =>
        setTimeout(resolve, PRZERWA)
    );


    /* 5340 → 5349 */

    await spin(3, KOD[3]);


    /* 🎉 */

    launchConfetti();
}


/*
   START
*/

window.addEventListener("load", () => {

    reels.forEach(buildReel);

    requestAnimationFrame(() => {

        showZeros();

        setTimeout(start, 250);

    });

});

</script>

</body>
</html>
